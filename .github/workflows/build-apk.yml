name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q -o mini-strike-apk.zip
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Install
        working-directory: mini-strike-apk
        run: npm install
      - name: Add android
        working-directory: mini-strike-apk
        run: npx cap add android
      - name: Patch
        working-directory: mini-strike-apk
        run: bash scripts/patch-android.sh
      - name: Sync
        working-directory: mini-strike-apk
        run: npx cap sync android
      - name: Build debug APK
        working-directory: mini-strike-apk/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mini-strike-apk
          path: mini-strike-apk/android/app/build/outputs/apk/debug/app-debug.apk
